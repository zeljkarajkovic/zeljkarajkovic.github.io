# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "NiX"
email: zeljka.rajkovic@gmail.com
url: "https://nix.hr" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
# github_username: jekyll

# Home page languages, in the order the navbar switch shows them. Each code
# needs a copy file at _data/home/<code>.yml; the first one is the default
# served at /.
languages:
  - hr
  - en

# Build settings
# No `remote_theme` here on purpose. This site renders entirely from the
# beautiful-jekyll files vendored into _layouts/, _includes/ and assets/, which
# have diverged from (and are ahead of) the upstream 6.0.1 tag. Those local
# files take precedence over a theme anyway, so pulling the remote theme would
# only add unused demo images and a network dependency to every build.

site-css:
  - "/assets/css/nix.css"

navbar-col: "#24493F"
navbar-text-col: "#F2F7F4"
navbar-border-col: "#1B3A32"
page-col: "#FFFFFF"
text-col: "#22302B"
link-col: "#1E7560"
hover-col: "#155446"
footer-col: "#172622"
footer-text-col: "#9DB0A8"
footer-link-col: "#E2EBE7"
footer-hover-col: "#9FD8C2"

date_format: "%B %-d, %Y"

timezone: "Europe/Vienna"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true # add comments to all blog posts
      social-share: true # add social media sharing buttons to all blog posts
  - scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
